version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: irrigation-app
    container_name: irrigation_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      # SQLite veritabanı dosyasının izin sorunlarını engellemek ve kalıcı olmasını sağlamak için
      - ./database:/var/www/database
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - irrigation_network

  web:
    image: nginx:alpine
    container_name: irrigation_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - irrigation_network

networks:
  irrigation_network:
    driver: bridge
