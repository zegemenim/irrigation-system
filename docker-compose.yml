version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: irrigation-app
    container_name: irrigation
    restart: unless-stopped
    volumes:
      - ./database:/var/www/html/database
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - web_network

networks:
  web_network:
    external: true
