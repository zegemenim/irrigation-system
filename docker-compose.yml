version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: irrigation-app
    container_name: irrigation
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # YALNIZCA veritabanı ve yüklenen dosyaların kalıcı olması için bu klasörleri bağlıyoruz.
      # Kodu bağlamıyoruz, böylece Vite build (public/build) klasörü container içinde sağlam kalıyor.
      - ./database:/var/www/html/database
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - irrigation_network

networks:
  irrigation_network:
    driver: bridge
